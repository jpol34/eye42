[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eye42"
version = "0.1.0"
description = "Passive camera+mic reconstruction of a Texas 42 domino game — bidding, trump, tricks, and score, with zero impact on gameplay."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jordan Polyak" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/eye42/engine/tests"]
