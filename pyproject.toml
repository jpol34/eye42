[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eye42"
version = "0.1.0"
description = "Texas 42 domino rules/scoring engine (bidding, trump, tricks, score) built and tested; passive camera+mic reconstruction (perception, speech) is stubbed for a future phase."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jordan Polyak" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
perception = [
    "opencv-contrib-python-headless",
    "numpy",
]
perception-hands = [
    "mediapipe",
]
perception-segmenter = [
    "onnxruntime",
]
perception-training = [
    "ultralytics",
]
speech = [
    "faster-whisper",
]
sim = [
    "mujoco>=3.12",
    "opencv-contrib-python-headless",
    "numpy",
]
sim-render = [
    "bpy",
]
live = [
    "flask",
    "opencv-contrib-python-headless",
    "sounddevice",
    "mediapipe",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/eye42/engine/tests", "src/eye42/perception/tests", "src/eye42/simgen/tests"]
markers = [
    "slow: exercises real physics/rendering over a full scripted hand -- seconds, not milliseconds",
]
