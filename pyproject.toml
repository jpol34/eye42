[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eye42"
version = "0.1.0"
description = "Texas 42 domino rules/scoring engine (bidding, trump, tricks, score) built and tested; passive camera+mic reconstruction (perception, speech) is stubbed for a future phase."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jordan Polyak" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
perception = [
    "opencv-python-headless",
    "numpy",
]
speech = [
    "faster-whisper",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/eye42/engine/tests"]
